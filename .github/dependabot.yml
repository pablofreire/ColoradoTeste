version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # The solution targets net6.0; new majors of EF Core, ASP.NET Core and test packages require net8.0+.
    # Majors are handled together with the planned target framework upgrade.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
