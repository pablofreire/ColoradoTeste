name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 6.0.x
      - name: Restore
        run: dotnet restore ColoradoTeste.sln
      - name: Build
        run: dotnet build ColoradoTeste.sln --no-restore -c Release
      - name: Test
        run: dotnet test ColoradoTeste.sln --no-build -c Release --logger "trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
