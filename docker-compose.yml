version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: colorado-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Colorado@123
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - colorado-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Colorado@123 -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./src
      dockerfile: Colorado.Api/Dockerfile
    container_name: colorado-api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - DatabaseProvider=SqlServer
      - ConnectionStrings__ConexaoPadrao=Server=sqlserver,1433;Database=ColoradoDb;User Id=sa;Password=Colorado@123;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - colorado-network
    restart: unless-stopped

  web:
    build:
      context: ./src
      dockerfile: Colorado.Web/Dockerfile
    container_name: colorado-web
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - DatabaseProvider=SqlServer
      - ConnectionStrings__ConexaoPadrao=Server=sqlserver,1433;Database=ColoradoDb;User Id=sa;Password=Colorado@123;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - colorado-network
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  colorado-network:
    driver: bridge
