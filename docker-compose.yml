services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: colorado-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set MSSQL_SA_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - colorado-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # The API and the Web app can also run from Visual Studio. Inside the compose network they use
  # the internal SQL port (1433); the 1434 host mapping is only for Visual Studio and SSMS.
  api:
    build:
      context: ./src
      dockerfile: Colorado.Api/Dockerfile
    container_name: colorado-api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - DatabaseProvider=SqlServer
      - ConnectionStrings__ConexaoPadrao=Server=sqlserver,1433;Database=ColoradoDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - colorado-network
    restart: unless-stopped

  web:
    build:
      context: ./src
      dockerfile: Colorado.Web/Dockerfile
    container_name: colorado-web
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ApiBaseUrl=http://api:80
    depends_on:
      - api
    networks:
      - colorado-network
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  colorado-network:
    driver: bridge
